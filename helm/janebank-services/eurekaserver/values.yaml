deploymentName: eurekasrver-deployment
serviceName: eurekasrver
appLabel: eurekasrver
appName: eurekasrver

replicaCount: 1

image:
  repository: ritujane78/eurekasrver
  tag: 9

containerPort: 8070

service:
  type: ClusterIP
  port: 8070
  targetPort: 8070

appname_enabled: true
profile_enabled: false
config_enabled: true
eureka_enabled: false
resouceserver_enabled: false
otel_enabled: true
kafka_enabled: false