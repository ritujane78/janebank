spring:
  application:
    name: gatewayserver
  config:
    import: optional:configserver:http://configserver:8071/
  cloud:
   gateway:
     server:
       webflux:
         discovery:
           locator:
             enabled: true
             lower-case-service-id: true
         httpclient:
           connect-timeout: 1000
           response-timeout: 10s
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://eurekaserver:8070/eureka/
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true
info:
  app:
    name: "gatewayserver"
    description: "Jane Bank Gateway Server Application"
    version: "1.0.0"
logging:
  level:
    com:
      jane:
        gatewayserver: DEBUG
resilience4j.circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000