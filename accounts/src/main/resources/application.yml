spring:
  application:
    name: accounts
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: root
    password: root
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import:
      - "application_qa.yml"
      - "application_prod.yml"
  profiles:
    active:
      - "qa"
build:
  version: 3.0
accounts:
  message: Welcome to Janebank accounts related local APIs
  contactDetails:
    name: "Jane Doe - Developer"
    email: "jane@janebank.com"
  onCallSupport:
    - (555) 555-1234
    - (555) 523-1345

