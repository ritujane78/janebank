spring:
  application:
    name: cards
  profiles:
    active: qa
  datasource:
    url: jdbc:mysql://localhost:3306/cardsdb
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always
  config:
    import: optional:configserver:http://localhost:8071/
server:
  port: 9000
management:
  endpoints:
    web:
      exposure:
        include: "*"